name: Automated Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-web-and-android:
    name: Build Web & Android
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next SemVer Tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main

      - name: Sync package.json version with generated tag
        run: |
          CLEAN_VER="${{ steps.tag_version.outputs.new_tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          npm version $CLEAN_VER --no-git-tag-version --allow-same-version

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Web Application
        run: npm run build

      - name: Package Web Distribution
        run: |
          cd dist
          zip -r ../anamnese-web-${{ steps.tag_version.outputs.new_tag }}.zip .
          cd ..

      - name: Build Android APK
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../anamnese-android-${{ steps.tag_version.outputs.new_tag }}.apk
          cd ..

      - name: Upload Web and APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-and-android
          path: |
            anamnese-web-*.zip
            anamnese-android-*.apk

  build-windows:
    name: Build Windows Executable
    needs: build-web-and-android
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync package.json version with generated tag
        shell: bash
        run: |
          CLEAN_VER="${{ needs.build-web-and-android.outputs.tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          npm version $CLEAN_VER --no-git-tag-version --allow-same-version

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Windows Executable (.exe)
        run: npm run electron:build

      - name: Rename Output Executable
        shell: bash
        run: |
          mv dist-electron/*.exe anamnese-windows-${{ needs.build-web-and-android.outputs.tag }}.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: anamnese-windows-*.exe

  publish-release:
    name: Publish Consolidated Release
    needs: [build-web-and-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Web and Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-and-android

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-web-and-android.outputs.tag }}
          name: Release ${{ needs.build-web-and-android.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            anamnese-web-*.zip
            anamnese-android-*.apk
            anamnese-windows-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}